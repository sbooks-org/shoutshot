<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shoutshot</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 340px; padding: 12px; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    header img { width: 22px; height: 22px; }
    header h1 { font-size: 15px; margin: 0; flex: 1; }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 6px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid button { text-align: left; }
    .grid button b { display: block; }
    .grid button span { font-size: 11px; color: var(--muted); }
    #drop { border: 1.5px dashed var(--border); border-radius: 8px; padding: 10px; text-align: center; color: var(--muted); margin-top: 6px; }
    #drop.over { border-color: var(--accent); color: var(--accent); }
    #status { margin-top: 10px; display: none; background: var(--panel); border-radius: 8px; padding: 8px 10px; }
    #status .mono { word-break: break-all; margin-top: 4px; user-select: all; }
    footer { margin-top: 10px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <h1>Shoutshot</h1>
    <div class="seg" id="hostSeg">
      <button data-host="imgur">Imgur</button>
      <button data-host="imgbb">ImgBB</button>
    </div>
  </header>

  <div class="label">Screenshot this tab</div>
  <div class="grid">
    <button id="region"><b>Select area</b><span>Drag a box</span></button>
    <button id="visible"><b>Visible page</b><span>Everything on screen</span></button>
  </div>

  <div class="label">Or upload an image you already have</div>
  <div class="grid">
    <button id="paste"><b>From clipboard</b><span>e.g. a macOS screenshot</span></button>
    <button id="pick"><b>Choose file…</b><span>PNG, JPG, GIF, WebP</span></button>
  </div>
  <div id="drop">…or just press ⌘V / Ctrl+V in this popup to paste an image</div>
  <input type="file" id="file" accept="image/*" hidden>

  <div id="status"></div>

  <div class="label">Recent</div>
  <ul class="hist" id="hist"></ul>

  <footer>
    <a href="#" id="settings">Settings &amp; all uploads</a>
    <span class="muted" id="hint"></span>
  </footer>

  <script src="defaults.js"></script>
  <script src="shared.js"></script>
  <script src="history-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
